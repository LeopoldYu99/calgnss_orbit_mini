syntax = "proto3";

package orbit_prediction;

import "google/protobuf/empty.proto";

service OrbitPredictionService {
    // 接收生命周期微服务下发的上注数据
    rpc ReceiveUplinkData(UplinkPacket)
        returns (CommonReply);

    // 接收生命周期微服务下发的授时数据
    rpc ReceiveTimeSync(TimeSyncData)
        returns (CommonReply);

    // 接收生命周期微服务下发的 RTCM 二进制数据
    rpc ReceiveRTCMData(RTCMData)
        returns (CommonReply);

    // 停止轨道预报服务
    rpc Stop(google.protobuf.Empty)
        returns (CommonReply);

    // 复位轨道预报服务
    rpc Reset(google.protobuf.Empty)
        returns (CommonReply);

    // 接收轨道预报请求，并流式返回预报结果
    rpc PredictOrbit(OrbitPredictionRequest)
        returns (stream OrbitData);
}

message UplinkPacket {
    uint32 port = 1;
    bytes packet_header = 2;
    bytes data = 3;
}

message TimeSyncData {
    int64 timestamp_ms = 1;
}

// RTCM 原始二进制数据
message RTCMData {
    bytes data = 1;
}

// 轨道预报请求参数
message OrbitPredictionRequest {
    int64 start_time_s = 1;   // 起始时间，Unix 时间戳，单位：秒
    uint32 duration_s = 2;    // 预报持续时间，单位：秒
    double step_s = 3;        // 预报步长，单位：秒，可为小数
}

message OrbitPoint {
    int64 timestamp_ms = 1;

    double x = 2;
    double y = 3;
    double z = 4;

    double vx = 5;
    double vy = 6;
    double vz = 7;
}

message OrbitData {
    repeated OrbitPoint points = 1;
}

message CommonReply {
    bool success = 1;      // 是否执行成功
    string message = 2;    // 返回信息或失败原因
}
